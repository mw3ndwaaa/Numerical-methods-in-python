[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-methods-engineering-python"
version = "0.1.0"
description = "Numerical methods implemented and verified with engineering examples in Python"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
